<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach">
<meta name="format-detection" content="telephone=no">
<title>Coach</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
:root{
  --bg:#000;--card:#121214;--card2:#1c1c1f;--card3:#26262a;--line:#2a2a2e;--text:#f5f5f7;--dim:#9a9aa0;--dim2:#5d5d63;
  --acc:#c8f73a;--acc-ink:#0c1200;--acc-soft:rgba(200,247,58,.12);
  --green:#30d158;--amber:#ff9f0a;--red:#ff453a;--blue:#64d2ff;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --tabh:58px;--r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
html{overflow-x:hidden}body{overflow-x:clip}
body{font:15px/1.38 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
a{color:var(--acc);text-decoration:none}
#app{padding:0 calc(16px + var(--sar)) calc(var(--tabh) + var(--sab) + 96px) calc(16px + var(--sal));max-width:560px;margin:0 auto}
.top{position:sticky;top:0;z-index:20;margin:0 calc(-16px - var(--sar)) 0 calc(-16px - var(--sal));padding:calc(var(--sat) + 10px) calc(16px + var(--sar)) 10px calc(16px + var(--sal));background:rgba(0,0,0,.82);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.top .row{display:flex;align-items:center;gap:12px}
.top .ttl{flex:1;min-width:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
h1{font-size:30px;line-height:1.1;margin:2px 0 0;font-weight:800;letter-spacing:-.02em}
h2{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em}
.iconbtn{width:44px;height:44px;border-radius:22px;background:var(--card2);display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}
.clock{margin-top:10px;background:var(--card);border-radius:14px;padding:10px 12px;display:none}
.clock.on{display:block}
.clock .l{display:flex;align-items:baseline;gap:8px}
.clock .t{font-size:22px;font-weight:800;letter-spacing:-.01em}
.clock .cap{color:var(--dim);font-weight:600}
.clock .st{margin-left:auto;font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:rgba(48,209,88,.15);color:var(--green)}
.clock.amber .st{background:rgba(255,159,10,.15);color:var(--amber)}
.clock.red .st{background:rgba(255,69,58,.15);color:var(--red)}
.bar{position:relative;height:8px;border-radius:4px;background:var(--card3);margin-top:8px;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--green);border-radius:4px;transition:width .5s}
.clock.amber .bar>i{background:var(--amber)} .clock.red .bar>i{background:var(--red)}
.bar>b{position:absolute;top:0;bottom:0;width:2px;background:rgba(0,0,0,.75)}
.clock .sub{font-size:12px;color:var(--dim);margin-top:6px;display:flex;justify-content:space-between;gap:8px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-top:12px}
.muted{color:var(--dim)} .small{font-size:13px} .tiny{font-size:11px}
.sec{margin:26px 2px 4px;display:flex;align-items:baseline;gap:8px}
.sec .k{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.sec .v{margin-left:auto;font-size:12px;color:var(--dim)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;letter-spacing:.04em;padding:3px 7px;border-radius:6px;background:var(--card3);color:var(--text);text-transform:uppercase;white-space:nowrap}
.pill.acc{background:var(--acc);color:var(--acc-ink)}
.pill.green{background:rgba(48,209,88,.16);color:var(--green)}
.pill.amber{background:rgba(255,159,10,.16);color:var(--amber)}
.pill.red{background:rgba(255,69,58,.16);color:var(--red)}
.pill.blue{background:rgba(100,210,255,.14);color:var(--blue)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:14px;background:var(--card2);font-weight:700;font-size:16px;padding:0 16px;width:100%}
.btn svg{width:20px;height:20px}
.btn.acc{background:var(--acc);color:var(--acc-ink)}
.btn.danger{color:var(--red)}
.btn.sm{min-height:44px;font-size:14px;border-radius:12px;width:auto}
.btns{display:flex;gap:10px;margin-top:12px}.btns>*{flex:1}
.rec{border-radius:var(--r);padding:14px;margin-top:12px;background:var(--card);position:relative;overflow:hidden}
.rec:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--dim2)}
.rec.green:before{background:var(--green)}.rec.amber:before{background:var(--amber)}.rec.red:before{background:var(--red)}
.rec.green{background:linear-gradient(90deg,rgba(48,209,88,.10),var(--card) 60%)}
.rec.amber{background:linear-gradient(90deg,rgba(255,159,10,.12),var(--card) 60%)}
.rec.red{background:linear-gradient(90deg,rgba(255,69,58,.12),var(--card) 60%)}
.rec .h{display:flex;align-items:center;gap:8px;font-weight:700}
.dot{width:10px;height:10px;border-radius:5px;background:var(--dim2);flex:none}
.dot.green{background:var(--green);box-shadow:0 0 10px var(--green)}.dot.amber{background:var(--amber);box-shadow:0 0 10px var(--amber)}.dot.red{background:var(--red);box-shadow:0 0 10px var(--red)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.stat{background:rgba(255,255,255,.04);border-radius:10px;padding:7px 2px;text-align:center;min-width:0}
.stat b{display:block;font-size:16px;font-weight:800}
.stat span{font-size:9.5px;color:var(--dim);font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.coachmsg{display:flex;gap:10px;align-items:flex-start}
.avatar{width:32px;height:32px;border-radius:16px;background:var(--acc);color:var(--acc-ink);font-weight:900;display:grid;place-items:center;flex:none;font-size:14px}
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px;margin-top:16px}
.seg button{flex:1;min-height:52px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;color:var(--dim);font-weight:700}
.seg button .d{font-size:18px;font-weight:800}
.seg button .s{font-size:10.5px;font-weight:600;letter-spacing:.02em}
.seg button.on{background:var(--card3);color:var(--text)}
.seg .next{position:absolute;top:-7px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:900;background:var(--acc);color:var(--acc-ink);border-radius:4px;padding:1px 4px;letter-spacing:.05em}
.seg.sm button{min-height:44px;font-size:14px}
.rec.cf:before{background:var(--blue)}
.rec.cf{background:linear-gradient(90deg,rgba(100,210,255,.11),var(--card) 60%)}
.rec.gym{padding:10px 14px}
.dot.cf{background:var(--blue);box-shadow:0 0 10px var(--blue)}
.btn.cfb{background:var(--blue);color:#00202c}
.nmw{position:relative}
.nmw.has .nm{display:inline-flex;align-items:center;gap:6px}
.nmw .swp{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--card3);color:var(--dim);font-size:13px;flex:none}
.nmw.lk .swp{opacity:.35}
.swapsel{position:absolute;inset:-6px -4px;width:calc(100% + 8px);opacity:0;font-size:16px;-webkit-appearance:none;appearance:none;cursor:pointer}
.swapsel:disabled{pointer-events:none}
.subfor{font-size:12px;color:#9fd8ee;margin-top:3px;display:flex;align-items:center;gap:4px}
.subfor .pill{font-size:9.5px;padding:2px 5px}
.useg{margin-left:auto;display:inline-flex;background:var(--card2);border-radius:10px;padding:3px;gap:2px;min-height:36px}
.useg button{min-width:40px;border-radius:8px;font-size:13px;font-weight:800;color:var(--dim)}
.useg button.on{background:var(--card3);color:var(--text)}
.scanbox{position:relative;margin-top:12px;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox.off{aspect-ratio:auto;min-height:120px;background:var(--card2)}
.scanbox.off video,.scanbox.off .scanframe{display:none}
.scanframe{position:absolute;left:6%;right:6%;top:24%;bottom:24%;border:2px solid rgba(200,247,58,.9);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scanframe i{position:absolute;left:4%;right:4%;top:50%;height:2px;background:var(--red);opacity:.85;animation:scanl 1.6s ease-in-out infinite}
@keyframes scanl{0%,100%{transform:translateY(-34px)}50%{transform:translateY(34px)}}
.scanst{position:absolute;left:10px;right:10px;bottom:10px;text-align:center;font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000}
.scanbox.off .scanst{position:static;padding:16px;color:#ffd59a;text-shadow:none;font-weight:600}
.scanst.bad{color:#ffd59a}
.codein{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--text);font:inherit;font-size:20px;font-weight:700;letter-spacing:.06em;padding:11px 12px;outline:none}
.codein:focus{border-color:var(--acc)}
.scimg{width:64px;height:64px;border-radius:12px;object-fit:contain;background:#fff;flex:none}
.scimg.sm{width:40px;height:40px;border-radius:8px}
.gin{width:100%;background:none;border:0;color:var(--text);font:inherit;font-size:24px;font-weight:800;text-align:center;outline:none;padding:0}
.scanspin{width:36px;height:36px;margin:24px auto;border-radius:50%;border:3px solid var(--card3);border-top-color:var(--acc);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.syncbad{color:#ffb4a8;font-weight:600}
.callout{margin-top:10px;border:1px dashed rgba(255,159,10,.45);background:rgba(255,159,10,.06);border-radius:12px;padding:10px 12px;font-size:13px;color:#ffd59a;display:flex;gap:8px}
.blk{margin-top:22px}
.blk .bh{display:flex;align-items:center;gap:8px;margin:0 2px 8px;min-height:22px}
.blk .bh .k{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.blk .bh .m{font-size:12px;color:var(--dim)}
.blk .bh .pace{margin-left:auto}
.ex{background:var(--card);border-radius:var(--r);margin-top:10px;overflow:hidden;transition:opacity .2s}
.ex .eh{display:flex;gap:10px;padding:14px 14px 8px;align-items:flex-start}
.code{min-width:34px;height:34px;padding:0 6px;border-radius:10px;background:var(--card3);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.ex.current .code{background:var(--acc);color:var(--acc-ink)}
.ex .nm{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.ex .meta{font-size:13px;color:var(--dim);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.ex .meta b{color:var(--text);font-weight:700}
.ex .chev{margin-left:auto;width:32px;height:32px;display:grid;place-items:center;color:var(--dim);flex:none}
.ex.done{opacity:.62}
.ex.done .code{background:rgba(200,247,58,.18);color:var(--acc)}
.ex .sum{display:none;padding:0 14px 14px 58px;color:var(--dim);font-size:13px}
.ex.done.closed .sum{display:block}
.ex.done.closed .body{display:none}
.prog{margin:4px 14px 0;border-radius:12px;background:var(--card2);padding:10px 12px;display:grid;grid-template-columns:52px 1fr;gap:6px 8px;font-size:13.5px;align-items:baseline}
.prog .k{font-size:10.5px;font-weight:800;letter-spacing:.07em;color:var(--dim);text-transform:uppercase}
.prog .tv{font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.prog .why{color:#c9c9ce;font-size:13px}
.plates{margin:8px 14px 0;font-size:12.5px;color:var(--dim);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.plate{display:inline-grid;place-items:center;min-width:28px;height:22px;padding:0 5px;border-radius:5px;font-size:11px;font-weight:800;color:#000}
.p45{background:#ff453a}.p35{background:#ffd60a}.p25{background:#30d158}.p10{background:#f5f5f7}.p5{background:#64d2ff}.p2_5{background:#bf5af2}
.links{display:flex;gap:8px;margin:10px 14px 0;flex-wrap:wrap}
.chip{min-height:36px;display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:0 11px;background:var(--card2);font-size:13px;font-weight:600;color:var(--text)}
.chip.on{background:var(--acc);color:var(--acc-ink)}
.chip svg{width:15px;height:15px}
details.cues{margin:8px 14px 0;background:var(--card2);border-radius:12px;padding:0 12px}
details.cues summary{list-style:none;min-height:40px;display:flex;align-items:center;font-size:13px;font-weight:600;color:var(--dim);cursor:pointer}
details.cues summary::-webkit-details-marker{display:none}
details.cues summary:after{content:"›";margin-left:auto;transform:rotate(90deg);font-size:18px;transition:transform .2s}
details.cues[open] summary:after{transform:rotate(-90deg)}
details.cues ul{margin:0 0 10px;padding-left:18px;font-size:13.5px;color:#d6d6db}
details.cues li{margin:3px 0}
.mach{display:flex;gap:8px;margin:8px 14px 0;flex-wrap:wrap;align-items:center}
.mach .lab{font-size:10.5px;font-weight:800;letter-spacing:.07em;color:var(--dim);width:100%}
.mach label{flex:1 1 70px;display:flex;flex-direction:column;background:var(--card2);border-radius:10px;padding:5px 9px;min-width:70px}
.mach label span{font-size:10.5px;color:var(--dim);font-weight:600}
.mach input{background:none;border:0;color:var(--text);font:inherit;font-weight:700;font-size:16px;padding:2px 0;width:100%;outline:none}
.sets{margin:10px 8px 0;padding-bottom:4px}
.sr{display:grid;grid-template-columns:40px 1fr 1fr 52px 52px;align-items:center;gap:4px;min-height:50px;border-radius:12px;padding:0 4px}
.sr.hd{min-height:26px;font-size:10.5px;font-weight:800;letter-spacing:.07em;color:var(--dim);text-transform:uppercase}
.sr.hd>*{text-align:center}
.sr .n{text-align:center;font-weight:800;color:var(--dim);font-size:14px}
.cell{height:42px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-size:18px;font-weight:700}
.cell.ph{color:var(--dim2)}
.cell.rpe{font-size:14px;color:var(--dim)}
.cell.rpe.ph{font-size:12px}
.sr .ck{width:44px;height:44px;border-radius:22px;border:2px solid var(--card3);display:grid;place-items:center;justify-self:center}
.sr .ck svg{width:20px;height:20px;opacity:0}
.sr.dn{background:rgba(200,247,58,.06)}
.sr.dn .ck{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.sr.dn .ck svg{opacity:1}
.sr.dn .cell{background:transparent}
.sr.up{box-shadow:inset 0 0 0 1.5px rgba(200,247,58,.55)}
.sr.wu .n{color:var(--blue);font-size:12px}
.sr.wu .cell{background:rgba(255,255,255,.03);font-size:15px;color:#bcbcc2;height:36px}
.sr.wu{min-height:44px}
.sr.wu .ck{width:38px;height:38px}
.sr.wu.dn .ck{background:var(--blue);border-color:var(--blue)}
.sr.wu.dn{background:rgba(100,210,255,.05)}
.sr .pls{font-size:10px;color:var(--dim);text-align:center;line-height:1.15}
.prchip{font-size:9px;font-weight:900;background:#ffd60a;color:#000;border-radius:4px;padding:1px 3px;margin-left:2px;vertical-align:2px}
.setops{display:flex;gap:8px;padding:6px 14px 14px}
.setops button{flex:1;min-height:44px;border-radius:10px;background:var(--card2);font-size:13px;font-weight:700;color:var(--dim)}
.wu-list{padding:0 14px 12px}
.wu-item{display:flex;align-items:center;gap:12px;min-height:48px;border-top:1px solid var(--line);font-size:15px}
.wu-item:first-child{border-top:0}
.wu-item .ck{width:28px;height:28px;border-radius:14px;border:2px solid var(--card3);display:grid;place-items:center;flex:none}
.wu-item .ck svg{width:16px;height:16px;opacity:0}
.wu-item.dn{color:var(--dim)} .wu-item.dn .ck{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)} .wu-item.dn .ck svg{opacity:1}
.ring{position:relative;flex:none;display:grid;place-items:center}
.ring svg{transform:rotate(-90deg);display:block}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.05}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;padding:6px calc(8px + var(--sar)) calc(6px + var(--sab)) calc(8px + var(--sal));background:rgba(12,12,13,.86);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid #222}
.tabs button{flex:1;max-width:120px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:600;color:#7c7c82}
.tabs button svg{width:25px;height:25px}
.tabs button.on{color:var(--acc)}
#rest{position:fixed;z-index:31;left:50%;transform:translate(-50%,160%);visibility:hidden;opacity:0;bottom:calc(var(--tabh) + var(--sab) + 10px);width:calc(100% - 24px);max-width:520px;background:#1d1d20;border:1px solid #303034;border-radius:22px;padding:8px 8px 10px 14px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 40px rgba(0,0,0,.7);transition:transform .3s cubic-bezier(.2,.9,.3,1.2)}
#rest.on{transform:translate(-50%,0);visibility:visible;opacity:1}
#rest .rt{font-size:26px;font-weight:800;letter-spacing:-.01em;min-width:62px}
#rest .rl{flex:1;min-width:0;font-size:12px;color:var(--dim);line-height:1.25}
#rest .rl b{color:var(--text);display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rest button{min-width:50px;height:44px;border-radius:14px;background:var(--card3);font-weight:800;font-size:14px;padding:0 8px}
#rest .rbar{position:absolute;left:14px;right:14px;bottom:3px;height:3px;border-radius:2px;background:var(--card3);overflow:hidden}
#rest .rbar i{display:block;height:100%;background:var(--acc);transition:width .25s linear}
#rest.go{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
#rest.go .rl,#rest.go .rl b{color:var(--acc-ink)}
#rest.go button{background:rgba(0,0,0,.15);color:var(--acc-ink)}
#scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;background:#1a1a1d;border-radius:22px 22px 0 0;padding:8px calc(16px + var(--sar)) calc(16px + var(--sab)) calc(16px + var(--sal));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:5px;border-radius:3px;background:#3a3a3e;margin:0 auto 10px}
.sheet h3{margin:4px 0 2px;font-size:18px}
.pf{display:flex;gap:10px;margin-top:10px}
.pf button{flex:1;border-radius:14px;background:var(--card2);padding:8px 12px;text-align:left;border:2px solid transparent;min-width:0}
.pf button.on{border-color:var(--acc);background:#202224}
.pf .lab{font-size:11px;font-weight:800;letter-spacing:.07em;color:var(--dim)}
.pf .val{font-size:34px;font-weight:800;letter-spacing:-.02em;min-height:42px}
.pf .val .cur{display:inline-block;width:2px;height:30px;background:var(--acc);vertical-align:-4px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.nudges{display:flex;gap:8px;margin-top:10px}

<body>
<div id="app"></div>
<div id="rest" aria-live="polite"></div>
<nav class="tabs" id="tabs"></nav>
<div id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div id="toast"></div>
<script src="program.js"></script>
<script>
/* =====================================================================
   COACH_DATA fallback, used only until coach.json arrives. With a sync token the
   app reads coach/coach.json from the private repo; without one, the public demo
   coach.json. The last good copy is kept in localStorage.
   ===================================================================== */
const COACH_DATA_FALLBACK = {
  updated: null,
  readiness: { rating: "unknown", note: "No readiness yet." },
  targets: {},
  message: "Loading coach data…"
};
</script>
<script>
"use strict";
/* ============================ storage ============================ */
const LS_KEY = "mikecoach";
const SCHEMA = 2;
const APP_VERSION = "1.5.1";

function seedState() {
  return {
    schema: SCHEMA,
    created: new Date().toISOString(),
    sessions: [],
    drafts: {},
    machine: {},
    foods: [
      { id: "f_whey", name: "Whey shake", serving: "1 scoop, water", kcal: 120, p: 25, c: 3, f: 1.5 },
      { id: "f_yog", name: "Greek yogurt, plain 2%", serving: "1 cup (227 g)", kcal: 170, p: 23, c: 9, f: 5 },
      { id: "f_chrice", name: "Chicken breast + rice", serving: "6 oz chicken + 1 cup rice", kcal: 480, p: 54, c: 45, f: 6 }
    ],
    meals: [],
    bodyweight: [],
    settings: { bar: 45, sound: true, gym: "std" },
    units: {},          // per-exercise weight unit preference: { farmer_carry: "kg" }
    fixes: {},          // coach.json corrections / foodAdds already applied: { <id>: isoTime }
    scans: {},          // barcode cache: { <code>: { code, name, brand, img, unitLabel, unitG, kcal, p, c, f, last, used } }
    rest: null,
    coachCache: null,   // last good coach.json
    coachSrc: null,     // where coachCache came from: "private" (coach-data via token) | "demo" (public)
    ui: { tab: "workout", day: null, foodDate: null, lift: null, open: {} }
  };
}
function migrate(s) {
  if (!s || typeof s !== "object") return seedState();
  if (!s.schema) s.schema = 1;
  // v1 -> v2 (app 1.2): adds settings.gym, units, fixes. Sessions/drafts/sets are unchanged;
  // sets may now carry kg (exact kg entered; w stays canonical lb) and exercises may carry slot.
  if (s.schema === 1) { s.units = s.units || {}; s.fixes = s.fixes || {}; s.settings = Object.assign({ gym: "std" }, s.settings || {}); s.schema = 2; }
  if (!s.scans) s.scans = {};   // v1.3 barcode cache (no schema bump needed)
  // Future schema bumps go here, e.g. if (s.schema === 2) { ...transform...; s.schema = 3; }
  const base = seedState();
  for (const k of Object.keys(base)) if (s[k] === undefined) s[k] = base[k];
  s.ui = Object.assign(base.ui, s.ui || {});
  s.ui.open = s.ui.open || {};
  s.settings = Object.assign(base.settings, s.settings || {});
  return s;
}
function load() {
  try { const raw = localStorage.getItem(LS_KEY); return raw ? migrate(JSON.parse(raw)) : seedState(); }
  catch (e) { console.warn(e); return seedState(); }
}
let S = load();
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { toast("Storage full: export a backup"); } try { syncNoteChange(); } catch (e) {} }

/* ============================ coach data (v1.5) ============================
   With a sync token: coach/coach.json + coach/history.json come from the PRIVATE repo
   (SYNC.repo, default mdsegalo/coach-data) via the Contents API; last good copies are cached
   (coach.json in S.coachCache, history.json in localStorage mikecoach_hist) for offline use.
   Without a token (a friend's phone): the public demo coach.json / history.json.
   A cached copy is only used in the mode it came from, so demo data never shows on the
   coach's phone and private data never shows without the token. */
const COACH_PATH = "coach/coach.json", HIST_PATH = "coach/history.json", HIST_KEY = "mikecoach_hist";
const PROGRAM_BASE = { targets: PROGRAM.targets, goal: PROGRAM.goal, redRule: PROGRAM.redRule, amberRule: PROGRAM.amberRule, athlete: PROGRAM.athlete };
function privMode() { try { return !!localStorage.getItem("mikecoach_gh_token"); } catch (e) { return false; } }
function pickCoach() {
  if (privMode()) return S.coachCache && S.coachSrc !== "demo" ? S.coachCache : COACH_DATA_FALLBACK;   // pre-1.5 caches came from the coach's own feed
  return S.coachCache && S.coachSrc === "demo" ? S.coachCache : COACH_DATA_FALLBACK;
}
let COACH = pickCoach();
let COACH_STATE = { src: privMode() ? (S.coachSrc === "private" ? "private-cache" : "waiting") : "demo", err: null, at: 0 };
function prof() { return (COACH && COACH.profile) || {}; }
function applyProfile() {
  const p = prof();
  for (const k of Object.keys(PROGRAM_BASE)) PROGRAM[k] = p[k] != null ? p[k] : PROGRAM_BASE[k];
}
function athleteName() { return prof().name || "Me"; }
function coachReady() { return !privMode() || S.coachSrc === "private"; }   // private targets/profile are loaded (sync waits for this)
function ghRaw(path) {
  const repo = (typeof SYNC !== "undefined" && SYNC.repo) || "";
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 15000);
  return fetch(`https://api.github.com/repos/${repo}/contents/${path}?t=${Date.now()}`, { cache: "no-store", signal: ctl.signal,
    headers: { Authorization: "Bearer " + localStorage.getItem("mikecoach_gh_token"), Accept: "application/vnd.github.raw", "X-GitHub-Api-Version": "2022-11-28" } })
    .then(r => { if (!r.ok) { const e = new Error("GitHub " + r.status); e.status = r.status; throw e; } return r.json(); })
    .finally(() => clearTimeout(to));
}
function setCoach(j, src) {
  if (!j || typeof j !== "object") return;
  const changed = JSON.stringify(j) !== JSON.stringify(COACH) || S.coachSrc !== src;
  COACH = j; S.coachCache = j; S.coachSrc = src; applyProfile(); applyCorrections(); applyFoodAdds(); save();
  if (changed && !document.querySelector(".sheet.on")) render();
}
function loadCoach() {
  if (privMode()) {
    ghRaw(COACH_PATH).then(j => { if (!privMode()) return; setCoach(j, "private"); COACH_STATE = { src: "private", err: null, at: Date.now() }; refreshCoachInfo(); })
      .catch(e => { COACH_STATE.err = e.status === 404 ? `${COACH_PATH} not found in ${SYNC.repo}` : e.status === 401 ? "token rejected" : e.status ? "GitHub " + e.status : "offline, using saved copy"; refreshCoachInfo(); });
  } else {
    fetch("coach.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(j => {
      if (privMode()) return; setCoach(j, "demo"); COACH_STATE = { src: "demo", err: null, at: Date.now() }; refreshCoachInfo();
    }).catch(() => {});
  }
}
function coachInfoText() {
  if (!privMode()) return "Demo data (no sync token on this phone)";
  const where = `private · ${SYNC.repo}`;
  if (COACH_STATE.src === "private") return `${where} · loaded`;
  if (S.coachSrc === "private") return `${where} · saved copy${COACH_STATE.err ? " (" + COACH_STATE.err + ")" : ""}`;
  return `${where} · ${COACH_STATE.err ? COACH_STATE.err : "loading…"}`;
}
function refreshCoachInfo() { const el = document.getElementById("coach-src"); if (el) el.textContent = coachInfoText(); }

/* ============================ imported history (BTWB, read-only) ============================
   history.json (private copy with a token, demo copy without) is merged at read time for charts,
   PRs, context and the History list. It never touches the app data in S. */
let IMPORTED = { meta: null, sessions: [] }, HIST_SIG = "", HIST_AT = 0;
function buildImported(j) {
  const map = j.appIds || {};
  const sessions = (j.sessions || []).map(s => {
    const by = new Map();
    for (const [lift, w, r, e] of s.sets) {
      const id = map[lift] || "btwb:" + lift;
      if (!by.has(id)) by.set(id, { id, name: lift, sets: [] });
      by.get(id).sets.push({ w, r, done: true, e1: !!e });
    }
    return { id: s.id, date: s.date, day: "BTWB", source: "btwb", readOnly: true, workout: s.workout, notes: s.notes || "", exercises: [...by.values()] };
  });
  return { meta: j, sessions };
}
function impLabel() { return (IMPORTED.meta && IMPORTED.meta.label) || "BTWB"; }
function setHistory(txt, priv) {
  let j; try { j = JSON.parse(txt); } catch (e) { return; }
  if (!j || !Array.isArray(j.sessions)) return;
  if (priv) { try { localStorage.setItem(HIST_KEY, txt); } catch (e) {} }
  const sig = (priv ? "p" : "d") + hashStr(txt); if (sig === HIST_SIG) return;
  HIST_SIG = sig; IMPORTED = buildImported(j);
  if (!document.querySelector(".sheet.on")) render();
}
function bootHistory() {   // synchronous: the private cached copy, so charts/PRs work before (or without) the network
  if (!privMode()) return; const txt = localStorage.getItem(HIST_KEY); if (!txt) return;
  try { const j = JSON.parse(txt); IMPORTED = buildImported(j); HIST_SIG = "p" + hashStr(txt); } catch (e) {}
}
function loadHistory(force) {
  if (!force && Date.now() - HIST_AT < 10 * 60 * 1000) return; HIST_AT = Date.now();
  if (privMode()) {
    ghRaw(HIST_PATH).then(j => { if (privMode()) setHistory(JSON.stringify(j), true); }).catch(() => { HIST_AT = 0; });
  } else {
    fetch("history.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.text() : Promise.reject(r.status)).then(t => { if (!privMode()) setHistory(t, false); }).catch(() => { HIST_AT = 0; });
  }
}
function clearPrivateCoach() {   // token removed / phone erased: drop private copies, go back to demo
  try { localStorage.removeItem(HIST_KEY); } catch (e) {}
  if (S.coachSrc !== "demo") { S.coachCache = null; S.coachSrc = null; }
  COACH = pickCoach(); applyProfile(); IMPORTED = { meta: null, sessions: [] }; HIST_SIG = ""; COACH_STATE = { src: "demo", err: null, at: 0 };
}

/* ============================ utils ============================ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad2 = n => String(n).padStart(2, "0");
function ymd(d = new Date()) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function parseYmd(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function daysBetween(a, b) { return Math.round((parseYmd(b) - parseYmd(a)) / 864e5); }
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function fmtMY(s) { const d = parseYmd(s); return MON[d.getMonth()] + " '" + String(d.getFullYear()).slice(2); }
function fmtDate(s, dow = true) { const d = parseYmd(s); return (dow ? DOW[d.getDay()] + ", " : "") + MON[d.getMonth()] + " " + d.getDate(); }
function mmss(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ":" + pad2(sec % 60); }
function r1(n) { return Math.round(n * 10) / 10; }
function fmtN(n) { if (n == null || n === "" || isNaN(+n)) return ""; const v = r1(+n); return Number.isInteger(v) ? String(v) : v.toFixed(1); }
function round5(n) { return Math.round(n / 5) * 5; }
const KG = 2.20462;
function kgOf(lb) { return lb == null || lb === "" ? null : Math.round(+lb / KG * 2) / 2; }   // nearest 0.5 kg
function lbOf(kg) { return kg == null || kg === "" ? null : Math.round(+kg * KG * 10) / 10; }
function isAssist(ex) { return !!ex && (ex.unit === "assist" || ex.unit === "band"); }
function kgOk(ex) { return !!ex && (ex.unit === "lb" || ex.unit === "lb/hand"); }
/* weight text for one set: "28kg", "135", "BW" */
function wTxt(s) { return s.kg != null && s.kg !== "" ? fmtN(s.kg) + "kg" : (fmtN(s.w) || "BW"); }
function uid(p = "x") { return p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
const today = () => ymd();
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 2200); }
function haptic(ms = 10) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="M7 8l5-5 5 5"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.4-6.5a1 1 0 0 0 0-1.7L9.5 4.6A1 1 0 0 0 8 5.5z"/></svg>',

/* ============================ PROGRESS (hand-rolled SVG charts) ============================ */
function lineChart({ series, xmin, xmax, ymin, ymax, w = 340, h = 190, yfmt = v => Math.round(v), xlabels = [], hlines = [] }) {
  const L = 34, R = 8, T = 12, B = 22, W = w - L - R, H = h - T - B;
  if (ymax - ymin < 1e-6) { ymax += 1; ymin -= 1; }
  let tickSt = (ymax - ymin) / 4;
  { const span = ymax - ymin, raw = span / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))); const st = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || raw; ymin = Math.floor(ymin / st) * st; ymax = ymin + st * 4; if (ymax < ymin + span) ymax += st; tickSt = st; }
  if (xmax - xmin < 1e-6) { xmax += 1; xmin -= 1; }
  const X = x => L + W * (x - xmin) / (xmax - xmin), Y = y => T + H * (1 - (y - ymin) / (ymax - ymin));
  let g = `<svg class="chart" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img">`;
  const nT = Math.round((ymax - ymin) / tickSt); for (let i = 0; i <= nT; i++) { const v = ymin + (ymax - ymin) * i / nT; g += `<line x1="${L}" x2="${w - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="#222226"/><text x="${L - 6}" y="${(Y(v) + 3.5).toFixed(1)}" fill="#76767c" font-size="10" text-anchor="end">${yfmt(v)}</text>`; }
  for (const hl of hlines) if (hl.y >= ymin && hl.y <= ymax) g += `<line x1="${L}" x2="${w - R}" y1="${Y(hl.y)}" y2="${Y(hl.y)}" stroke="${hl.color}" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${w - R}" y="${Y(hl.y) - 5}" fill="${hl.color}" font-size="10" text-anchor="end" font-weight="700">${esc(hl.label)}</text>`;
  xlabels.forEach((xl, i) => { g += `<text x="${X(xl.x).toFixed(1)}" y="${h - 5}" fill="#76767c" font-size="10" text-anchor="${i === 0 ? "start" : i === xlabels.length - 1 ? "end" : "middle"}">${esc(xl.t)}</text>`; });
  for (const s of series) {
    if (!s.pts.length) continue;
    const d = s.pts.map((p, i) => (i ? "L" : "M") + X(p.x).toFixed(1) + " " + Y(p.y).toFixed(1)).join(" ");
    if (s.area && s.pts.length > 1) g += `<path d="${d} L${X(s.pts[s.pts.length - 1].x).toFixed(1)} ${T + H} L${X(s.pts[0].x).toFixed(1)} ${T + H} Z" fill="${s.color}" opacity=".10"/>`;
    if (s.width) g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width}" ${s.dash ? `stroke-dasharray="${s.dash}"` : ""} stroke-linejoin="round" stroke-linecap="round"/>`;
    if (s.dots) for (const p of s.pts) g += `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${p.big ? 5.5 : 4}" fill="${p.big ? "#ffd60a" : s.color}" stroke="#000" stroke-width="1.5"/>`;
  }
  return g + "</svg>";
}

function exportJson() {
  const data = JSON.stringify(Object.assign({ app: "mike-coach", exported: new Date().toISOString() }, S), null, 1);
  const name = "coach-backup-" + today() + ".json";
  try {
    const file = new File([data], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: name }).catch(() => {}); return; }
  } catch (e) {}
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast("Backup downloaded");
}
function importJson(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const j = JSON.parse(rd.result); if (!Array.isArray(j.sessions) || !Array.isArray(j.meals)) throw 0;
      if (!confirm(`Replace the data on this phone with this backup (${j.sessions.length} sessions, ${j.meals.length} food entries)?`)) return;
      delete j.exported; delete j.app; S = migrate(j); SYNC.fp = {}; saveSync(); save(); closeSheet(); render(); toast("Backup restored");
    } catch (e) { toast("That file isn't a Coach backup"); }
  };
  rd.readAsText(file);
}

function act(a, t) {

    case "gym": { if (gymMode() === v) break; pinLogged(); S.settings.gym = v; Object.keys(S.drafts).forEach(syncDraft); save(); render(); toast(v === "crossfit" ? "CrossFit gym: machine lifts swapped" : "Full gym: plan as written"); break; }
    case "unit": setUnit(day, id, v); syncDraft(day); save(); render(); toast(v === "kg" ? "Weights in kg for this lift" : "Weights in lb for this lift"); break;
    case "mode": S.drafts[day].mode = v; syncDraft(day); save(); render(); toast(v === "amber" ? "Amber plan: last set of each block dropped" : "Back to the plan as written"); break;

function dayDoc(date) {

function syncStatusText() {

async function syncTest() {
